[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbits"
version = "0.1.0"
description = "Kepler-equation solver: a packaging and testing example"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "NPY"]   # pycodestyle, pyflakes, isort, pyupgrade, bugbear, numpy rules
